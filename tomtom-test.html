<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TESTE — TomTom / Velocidade da Via</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:20px;color:#111827}
.card{max-width:620px;margin:0 auto 16px;background:white;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0001}
h1{font-size:22px;margin:0 0 6px}.tag{display:inline-block;background:#f59e0b;color:#111;padding:5px 9px;border-radius:8px;font-weight:bold;font-size:12px}
label{display:block;font-weight:bold;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}.primary{background:#166534;color:white}.secondary{background:#e5e7eb;color:#111827}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#f9fafb;border-radius:10px;padding:12px}.value{font-size:20px;font-weight:bold;margin-top:5px;word-break:break-word}
.status{padding:12px;border-radius:10px;background:#fef3c7;margin-top:12px}.ok{background:#dcfce7}.err{background:#fee2e2}
small{color:#6b7280} .danger{color:#b91c1c}
</style>
</head>
<body>
<div class="card">
  <span class="tag">🧪 TESTE — NÃO OFICIAL</span>
  <h1>TomTom / Velocidade da Via</h1>
  <small>Laboratório separado do Assistente de Viagem V35 oficial.</small>
</div>

<div class="card">
  <label for="apiKey">API Key TomTom</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="Cole sua chave aqui">
  <button class="secondary" id="saveKey">Salvar chave neste aparelho</button>
  <small> A chave fica somente no armazenamento local deste aparelho. Não coloque a chave no GitHub.</small>
</div>

<div class="card">
  <button class="primary" id="gps">📍 Obter GPS e consultar limite da via</button>
  <div id="status" class="status">Aguardando teste.</div>
</div>

<div class="card">
  <div class="grid">
    <div class="box"><small>Latitude</small><div class="value" id="lat">—</div></div>
    <div class="box"><small>Longitude</small><div class="value" id="lon">—</div></div>
    <div class="box"><small>Velocidade GPS</small><div class="value" id="gpsSpeed">—</div></div>
    <div class="box"><small>Limite da via</small><div class="value" id="limit">—</div></div>
  </div>
  <div class="box" style="margin-top:10px"><small>Via</small><div class="value" id="street">—</div></div>
  <div class="box" style="margin-top:10px"><small>Última consulta</small><div class="value" id="time">—</div></div>
</div>

<script>
const KEY='teste_tomtom_api_key';
const $=id=>document.getElementById(id);
const saved=localStorage.getItem(KEY); if(saved) $('apiKey').value=saved;
$('saveKey').addEventListener('click',()=>{const k=$('apiKey').value.trim();if(!k){setStatus('Digite a API Key primeiro.','err');return}localStorage.setItem(KEY,k);setStatus('Chave salva somente neste aparelho.','ok');});
function setStatus(t,c=''){const e=$('status');e.textContent=t;e.className='status '+c;}
function fmtSpeed(v){if(v===null||v===undefined||v==='')return 'Não informado';return String(v).replace('KMPH',' km/h').replace('KMH',' km/h').replace('MPH',' mph');}
function getPosition(){return new Promise((resolve,reject)=>{if(!navigator.geolocation){reject(new Error('Este ambiente não disponibiliza GPS/geolocalização.'));return}navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:20000,maximumAge:5000});});}
async function queryTomTom(lat,lon,speed){
 const key=$('apiKey').value.trim()||localStorage.getItem(KEY);
 if(!key) throw new Error('Informe a API Key TomTom.');
 const url='https://api.tomtom.com/search/2/reverseGeocode/'+encodeURIComponent(lat+','+lon)+'.json?key='+encodeURIComponent(key)+'&returnSpeedLimit=true&radius=100&language=pt-BR';
 const r=await fetch(url,{headers:{'Accept':'application/json'}});
 const data=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error('TomTom HTTP '+r.status+(data.errorText?': '+data.errorText:''));
 const item=data.addresses&&data.addresses[0];
 if(!item) throw new Error('TomTom não encontrou uma via para esta posição.');
 const a=item.address||{};
 $('street').textContent=a.streetNameAndNumber||a.streetName||a.freeformAddress||'Via não informada';
 $('limit').textContent=fmtSpeed(a.speedLimit);
 $('time').textContent=new Date().toLocaleString('pt-BR');
 if(a.speedLimit) setStatus('Consulta concluída: limite retornado pela TomTom.','ok');
 else setStatus('Consulta concluída, mas a TomTom não informou limite para este ponto.','');
}
$('gps').addEventListener('click',async()=>{
 try{
  setStatus('Solicitando localização GPS...');
  const p=await getPosition();
  const lat=p.coords.latitude,lon=p.coords.longitude;
  $('lat').textContent=lat.toFixed(6);$('lon').textContent=lon.toFixed(6);
  const kmh=p.coords.speed==null?'—':(p.coords.speed*3.6).toFixed(1)+' km/h';$('gpsSpeed').textContent=kmh;
  setStatus('GPS obtido. Consultando TomTom...');
  await queryTomTom(lat,lon,p.coords.speed);
 }catch(e){console.error(e);setStatus(e.message||'Falha no teste.','err');}
});
</script>
</body>
</html>
