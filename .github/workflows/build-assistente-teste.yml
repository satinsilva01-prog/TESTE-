name: Assistente de Viagem — TESTE TomTom + Manutenção

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório de teste
        uses: actions/checkout@v4

      - name: Baixar base oficial V35 em área isolada
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/satinsilva01-prog/assistente-de-viagem.git source
          test -s source/index.html
          test -s ./manutencao-relatorio.js
          test -s ./tomtom-integracao-teste.js
          cp ./manutencao-relatorio.js source/manutencao-relatorio.js
          cp ./tomtom-integracao-teste.js source/tomtom-integracao.js

      - name: Integrar recursos no V35 sem alterar o oficial
        working-directory: source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Assistente de Viagem V35</title>', '<title>Assistente de Viagem — TESTE V35 TomTom + Manutenção</title>', 1)
          for tag in ['<script src="tomtom-integracao.js"></script>', '<script src="manutencao-relatorio.js"></script>']:
              if tag not in s:
                  pos=s.lower().rfind('</body>')
                  if pos < 0: raise SystemExit('INDEX sem </body>')
                  s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          # O teste precisa ser um aplicativo Android diferente do oficial.
          g=Path('app/build.gradle.kts')
          gs=g.read_text(encoding='utf-8')
          gs=gs.replace('applicationId = "com.assistentedeviagem.app"', 'applicationId = "com.assistentedeviagem.app.teste"', 1)
          gs=gs.replace('versionCode = 4', 'versionCode = 35', 1)
          gs=gs.replace('versionName = "2.1"', 'versionName = "35.0-TESTE"', 1)
          g.write_text(gs,encoding='utf-8')
          m=Path('app/src/main/AndroidManifest.xml')
          ms=m.read_text(encoding='utf-8').replace('android:label="Assistente de Viagem"','android:label="Assistente de Viagem — TESTE V35"',1)
          m.write_text(ms,encoding='utf-8')
          PY
          rm -rf app/build .gradle
          rm -f app/src/main/assets/index.html app/src/main/assets/tomtom-integracao.js app/src/main/assets/manutencao-relatorio.js
          mkdir -p app/src/main/assets
          cp -f index.html app/src/main/assets/index.html
          cp -f tomtom-integracao.js app/src/main/assets/tomtom-integracao.js
          cp -f manutencao-relatorio.js app/src/main/assets/manutencao-relatorio.js

          # Guarda-corpos: se qualquer item essencial da V35 desaparecer, o build falha.
          grep -q 'Assistente de Viagem — TESTE V35 TomTom + Manutenção' index.html
          grep -q 'function resetApp' index.html
          grep -q 'id="abBarras"' index.html
          grep -q 'tomtom-integracao.js' index.html
          grep -q 'manutencao-relatorio.js' index.html
          grep -q 'CITY_MS=120000' tomtom-integracao.js
          grep -q 'ROAD_MS=360000' tomtom-integracao.js
          grep -q 'btnRelatorioManutencao' manutencao-relatorio.js
          grep -q 'applicationId = "com.assistentedeviagem.app.teste"' app/build.gradle.kts
          grep -q 'android:label="Assistente de Viagem — TESTE V35"' app/src/main/AndroidManifest.xml

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar APK de TESTE separado
        working-directory: source
        run: gradle clean :app:assembleDebug --no-build-cache

      - name: Renomear APK de TESTE
        working-directory: source
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AssistenteDeViagem_TESTE_V35_TomTom_Manutencao.apk
          sha256sum app/build/outputs/apk/debug/AssistenteDeViagem_TESTE_V35_TomTom_Manutencao.apk

      - name: Publicar APK separado do oficial
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-TESTE-V35-TomTom-Manutencao-PDF
          path: source/app/build/outputs/apk/debug/AssistenteDeViagem_TESTE_V35_TomTom_Manutencao.apk
          if-no-files-found: error
