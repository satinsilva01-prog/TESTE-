name: Assistente de Viagem — TESTE TomTom + Manutenção

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar base oficial V35 em área isolada
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/satinsilva01-prog/assistente-de-viagem.git source
          cp manutencao-relatorio.js source/manutencao-relatorio.js
          cp tomtom-integracao-teste.js source/tomtom-integracao.js

      - name: Injetar recursos de teste sem alterar a base oficial
        working-directory: source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for tag in ['<script src="tomtom-integracao.js"></script>','<script src="manutencao-relatorio.js"></script>']:
              if tag not in s:
                  pos=s.lower().rfind('</body>')
                  if pos < 0: raise SystemExit('INDEX sem </body>')
                  s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
          rm -rf app/build .gradle
          rm -f app/src/main/assets/index.html app/src/main/assets/tomtom-integracao.js app/src/main/assets/manutencao-relatorio.js
          mkdir -p app/src/main/assets
          cp -f index.html app/src/main/assets/index.html
          cp -f tomtom-integracao.js app/src/main/assets/tomtom-integracao.js
          cp -f manutencao-relatorio.js app/src/main/assets/manutencao-relatorio.js
          grep -q 'Assistente de Viagem V35' index.html
          grep -q 'function resetApp' index.html
          grep -q 'id="abBarras"' index.html
          grep -q 'tomtom-integracao.js' app/src/main/assets/index.html
          grep -q 'manutencao-relatorio.js' app/src/main/assets/index.html

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar APK de TESTE
        working-directory: source
        run: gradle clean :app:assembleDebug --no-build-cache

      - name: Validar APK
        working-directory: source
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          echo 'APK TESTE — TomTom econômico + limite manual + relatório de manutenção PDF'

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-TESTE-TomTom-Manutencao-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
