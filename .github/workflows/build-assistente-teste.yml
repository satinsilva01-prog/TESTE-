name: Assistente de Viagem — TESTE V35 integrado

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório de teste
        uses: actions/checkout@v4

      - name: Baixar cópia da V35 oficial
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/satinsilva01-prog/assistente-de-viagem.git source
          test -s source/index.html
          test -s ./tomtom-integracao-teste.js
          test -s ./manutencao-relatorio.js

      - name: Integrar recursos DIRETAMENTE no index.html da cópia de teste
        working-directory: source
        run: |
          set -euxo pipefail
          cp ../tomtom-integracao-teste.js ./tomtom-integracao.js
          cp ../manutencao-relatorio.js ./manutencao-relatorio.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='ASSISTENTE_TESTE_V35_TOMTOM_MANUTENCAO_INTEGRADO'
          if marker in s:
              raise SystemExit('Integração já presente; não duplicar')
          title='<title>Assistente de Viagem V35</title>'
          s=s.replace(title,'<title>Assistente de Viagem V35 — TESTE TomTom + Manutenção</title>',1)
          tt=Path('tomtom-integracao.js').read_text(encoding='utf-8')
          mt=Path('manutencao-relatorio.js').read_text(encoding='utf-8')
          injection='''\n<script>/* ASSISTENTE_TESTE_V35_TOMTOM_MANUTENCAO_INTEGRADO */\n'''+tt+'''\n</script>\n<script>\n'''+mt+'''\n</script>\n'''
          pos=s.lower().rfind('</body>')
          if pos<0: raise SystemExit('V35 sem </body>')
          s=s[:pos]+injection+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY

          # O APK de teste precisa ser outro aplicativo, instalado ao lado do oficial.
          python3 - <<'PY'
          from pathlib import Path
          g=Path('app/build.gradle.kts')
          s=g.read_text(encoding='utf-8')
          s=s.replace('applicationId = "com.assistentedeviagem.app"','applicationId = "com.assistentedeviagem.app.teste"',1)
          s=s.replace('versionCode = 4','versionCode = 3501',1)
          s=s.replace('versionName = "2.1"','versionName = "35.0-TESTE"',1)
          g.write_text(s,encoding='utf-8')
          m=Path('app/src/main/AndroidManifest.xml')
          s=m.read_text(encoding='utf-8')
          s=s.replace('android:label="Assistente de Viagem"','android:label="Assistente de Viagem TESTE V35"',1)
          m.write_text(s,encoding='utf-8')
          PY

          # Guardas obrigatórias: se faltar qualquer item, NÃO gera APK.
          grep -q 'ASSISTENTE_TESTE_V35_TOMTOM_MANUTENCAO_INTEGRADO' index.html
          grep -q 'Assistente de Viagem V35 — TESTE TomTom + Manutenção' index.html
          grep -q 'function resetApp' index.html
          grep -q 'id="abBarras"' index.html
          grep -q 'API Key TomTom' index.html
          grep -q 'Limite manual de reserva' index.html
          grep -q 'CITY_MS=120000' index.html
          grep -q 'ROAD_MS=360000' index.html
          grep -q 'btnRelatorioManutencao' index.html
          grep -q 'Gerar relatório PDF' index.html
          grep -q 'applicationId = "com.assistentedeviagem.app.teste"' app/build.gradle.kts
          grep -q 'android:label="Assistente de Viagem TESTE V35"' app/src/main/AndroidManifest.xml

          mkdir -p app/src/main/assets
          cp -f index.html app/src/main/assets/index.html

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar APK separado
        working-directory: source
        run: gradle clean :app:assembleDebug --no-build-cache --rerun-tasks

      - name: Validar APK e renomear
        working-directory: source
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mv "$APK" app/build/outputs/apk/debug/AssistenteDeViagem_TESTE_V35_TomTom_Manutencao_INTEGRADO.apk
          sha256sum app/build/outputs/apk/debug/AssistenteDeViagem_TESTE_V35_TomTom_Manutencao_INTEGRADO.apk

      - name: Publicar APK de teste sem substituir o oficial
        uses: actions/upload-artifact@v4
        with:
          name: AssistenteDeViagem-TESTE-V35-INTEGRADO-TomTom-Manutencao
          path: source/app/build/outputs/apk/debug/AssistenteDeViagem_TESTE_V35_TomTom_Manutencao_INTEGRADO.apk
          if-no-files-found: error
