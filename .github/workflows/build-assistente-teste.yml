name: Assistente de Viagem — TESTE V35 HTML validado

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto de TESTE
        uses: actions/checkout@v4

      - name: Baixar estrutura Android da V35
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/satinsilva01-prog/assistente-de-viagem.git source
          test -s source/index.html
          test -s "$GITHUB_WORKSPACE/index.html"

      - name: Copiar EXATAMENTE o HTML validado do TESTE para o APK
        run: |
          set -euxo pipefail
          cp -f "$GITHUB_WORKSPACE/index.html" "$GITHUB_WORKSPACE/source/index.html"
          echo 'VALIDANDO O HTML QUE ENTRARA NO APK:'
          grep -q 'tomtomApiKey' "$GITHUB_WORKSPACE/source/index.html"
          grep -q 'btnRelatorioManutencao' "$GITHUB_WORKSPACE/source/index.html"
          grep -q 'avFuelBars' "$GITHUB_WORKSPACE/source/index.html"
          grep -q 'btnResetApp' "$GITHUB_WORKSPACE/source/index.html"
          grep -q 'av-trip-panel' "$GITHUB_WORKSPACE/source/index.html"
          echo 'SHA DO HTML DO TESTE:'
          sha256sum "$GITHUB_WORKSPACE/index.html"
          echo 'SHA DO HTML COPIADO PARA O APK:'
          sha256sum "$GITHUB_WORKSPACE/source/index.html"
          cmp "$GITHUB_WORKSPACE/index.html" "$GITHUB_WORKSPACE/source/index.html"

      - name: Criar identificador Android separado para TESTE
        working-directory: source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates=[Path('app/build.gradle'),Path('app/build.gradle.kts')]
          p=next((x for x in candidates if x.exists()),None)
          if p is None:
              raise SystemExit('Gradle do app não encontrado')
          s=p.read_text(encoding='utf-8')
          if p.name=='build.gradle':
              if 'applicationIdSuffix ".teste"' not in s:
                  s=re.sub(r'(defaultConfig\s*\{)', r'\1\n        applicationIdSuffix ".teste"', s, count=1)
          else:
              if 'applicationIdSuffix(".teste")' not in s:
                  s=re.sub(r'(defaultConfig\s*\{)', r'\1\n        applicationIdSuffix(".teste")', s, count=1)
          p.write_text(s,encoding='utf-8')
          print('applicationIdSuffix .teste configurado em',p)
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar APK TESTE
        working-directory: source
        run: |
          set -euxo pipefail
          gradle clean :app:assembleDebug --no-build-cache
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mv "$APK" app/build/outputs/apk/debug/AssistenteDeViagem_TESTE_V35_TomTom_Manutencao_INTEGRADO.apk
          sha256sum app/build/outputs/apk/debug/AssistenteDeViagem_TESTE_V35_TomTom_Manutencao_INTEGRADO.apk

      - name: Publicar APK TESTE
        uses: actions/upload-artifact@v4
        with:
          name: AssistenteDeViagem-TESTE-V35-TomTom-Manutencao-INTEGRADO
          path: source/app/build/outputs/apk/debug/AssistenteDeViagem_TESTE_V35_TomTom_Manutencao_INTEGRADO.apk
          if-no-files-found: error
