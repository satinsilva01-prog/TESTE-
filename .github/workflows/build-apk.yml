name: Teste APK Reset

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/testereset/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          printf '%s\n' "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" "rootProject.name='TesteReset'" "include ':app'" > settings.gradle
          printf '%s\n' "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          cat > app/build.gradle <<'EOF'
plugins { id 'com.android.application' }
android { namespace 'com.teste.reset'; compileSdk 35
  defaultConfig { applicationId 'com.teste.reset'; minSdk 23; targetSdk 35; versionCode 2; versionName '1.1' }
}
EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" /></resources>
EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
 <application android:theme="@style/AppTheme" android:label="Teste Reset" android:icon="@android:drawable/ic_menu_rotate">
  <activity android:name=".MainActivity" android:exported="true">
   <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
  </activity>
 </application>
</manifest>
EOF
          cat > app/src/main/java/com/testereset/app/MainActivity.java <<'EOF'
package com.teste.reset;
import android.app.Activity; import android.os.Bundle; import android.webkit.*; import android.content.Context;
public class MainActivity extends Activity {
 WebView w;
 public void onCreate(Bundle b){super.onCreate(b); w=new WebView(this); w.getSettings().setJavaScriptEnabled(true); w.getSettings().setDomStorageEnabled(true); w.setWebViewClient(new WebViewClient()); w.addJavascriptInterface(new Bridge(this),"AndroidGPS"); setContentView(w); w.loadUrl("file:///android_asset/index.html");}
 public static class Bridge { Context c; Bridge(Context x){c=x;} @JavascriptInterface public void resetAll(){c.getSharedPreferences("trip",0).edit().clear().apply(); c.getSharedPreferences("app",0).edit().clear().apply(); c.getSharedPreferences("vehicle",0).edit().clear().apply(); WebStorage.getInstance().deleteAllData();} }
}
EOF

      - name: Compilar
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Teste-Reset-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
