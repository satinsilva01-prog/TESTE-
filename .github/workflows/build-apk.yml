name: APK - Teste isolado do Reset

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android de teste
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/testereset/app
          mkdir -p app/src/main/res/values
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = 'TesteReset'
include ':app'
EOF

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

          cat > app/build.gradle <<'EOF'
plugins { id 'com.android.application' }

android {
    namespace 'com.teste.reset'
    compileSdk 35
    defaultConfig {
        applicationId 'com.teste.reset'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}
EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />
</resources>
EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application
        android:theme="@style/AppTheme"
        android:label="Teste Reset"
        android:icon="@android:drawable/ic_menu_rotate">
        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

          cat > app/src/main/java/com/testereset/app/MainActivity.java <<'EOF'
package com.teste.reset;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.JavascriptInterface;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.content.Context;
import android.webkit.WebStorage;

public class MainActivity extends Activity {
    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        webView = new WebView(this);
        webView.getSettings().setJavaScriptEnabled(true);
        webView.getSettings().setDomStorageEnabled(true);
        webView.setWebViewClient(new WebViewClient());
        webView.addJavascriptInterface(new Bridge(this), "AndroidGPS");
        setContentView(webView);
        webView.loadUrl("file:///android_asset/index.html");
    }

    public static class Bridge {
        private final Context context;
        Bridge(Context context) { this.context = context; }

        @JavascriptInterface
        public void resetAll() {
            context.getSharedPreferences("trip", 0).edit().clear().apply();
            context.getSharedPreferences("app", 0).edit().clear().apply();
            context.getSharedPreferences("vehicle", 0).edit().clear().apply();
            WebStorage.getInstance().deleteAllData();
        }
    }
}
EOF

      - name: Verificar projeto
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/testereset/app/MainActivity.java

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Teste-Reset-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Rebuild trigger: isolated reset test v1.1
