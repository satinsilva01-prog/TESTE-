name: Teste APK Reset

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android de teste
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/testereset/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='TesteReset'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.teste.reset'; compileSdk 35
            defaultConfig { applicationId 'com.teste.reset'; minSdk 23; targetSdk 35; versionCode 5; versionName '1.4' }
          }
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" /></resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme" android:label="Teste Reset" android:icon="@android:drawable/ic_menu_rotate">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/testereset/app/MainActivity.java <<'EOF'
          package com.teste.reset;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.JavascriptInterface;
          import android.content.Context;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          public class MainActivity extends Activity {
            WebView w;
            Bridge bridge;
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              LinearLayout root=new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              Button nativeReset=new Button(this);
              nativeReset.setText("RESET NATIVO ANDROID");
              nativeReset.setTextSize(17);
              nativeReset.setTextColor(Color.WHITE);
              nativeReset.setBackgroundColor(Color.rgb(210,35,35));
              w=new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              bridge=new Bridge(this);
              w.addJavascriptInterface(bridge,"AndroidGPS");
              nativeReset.setOnClickListener(v -> { bridge.resetAll(); w.reload(); });
              root.addView(nativeReset,new LinearLayout.LayoutParams(-1,70));
              root.addView(w,new LinearLayout.LayoutParams(-1,0,1));
              setContentView(root);
              w.loadUrl("file:///android_asset/index.html");
            }
            public static class Bridge {
              final Context c;
              Bridge(Context x){c=x;}
              @JavascriptInterface public String getTestValue(){return c.getSharedPreferences("RESET_TEST",0).getString("value","0");}
              @JavascriptInterface public void setTestValue(String value){c.getSharedPreferences("RESET_TEST",0).edit().putString("value",value).commit();}
              public void resetAll(){c.getSharedPreferences("RESET_TEST",0).edit().clear().commit();}
            }
          }
          EOF

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Teste-Reset-Nativo-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
