<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Calculadora de Compras</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172033;font:16px system-ui,-apple-system,Segoe UI,Roboto,Arial}main{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;margin-bottom:12px}.total{font-size:42px;font-weight:800}.muted{color:#667085;font-size:13px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}input{width:100%;min-height:48px;border:1px solid #cbd0d8;border-radius:11px;padding:10px;font:inherit}button{min-height:46px;border:0;border-radius:11px;padding:10px 14px;font-weight:700;font:inherit;background:#2563eb;color:#fff}.gray{background:#e5e7eb;color:#172033}.top{width:100%;font-size:18px;min-height:56px;margin-bottom:12px}video{width:100%;display:block;border-radius:14px;background:#111}.cam{display:none}.actions{display:flex;gap:8px;margin-top:8px}.actions button{flex:1}.item{display:flex;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid #eee}.info{flex:1;min-width:0}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.value{font-weight:800;white-space:nowrap}.qty button{min-height:38px;width:38px;padding:0}.warning{padding:10px;border-radius:10px;background:#fff7df;border:1px solid #ead49a;font-size:13px}.hist{padding:10px 0;border-bottom:1px solid #eee}
</style></head><body><main><h2>🛒 Calculadora de Compras</h2>
<button id="camera" class="top">📷 CAPTURAR PREÇO DA ETIQUETA</button>
<section class="card"><div class="muted">TOTAL DA COMPRA</div><div id="total" class="total">R$ 0,00</div></section>
<section class="card"><div class="row"><input id="nome" placeholder="Produto (opcional)"><input id="preco" inputmode="decimal" placeholder="Preço R$"></div><div class="actions"><button id="add">＋ Adicionar</button></div><div id="msg" class="muted" style="margin-top:8px">Digite o valor ou use a câmera.</div></section>
<section id="camBox" class="card cam"><video id="video" playsinline autoplay muted></video><div class="actions"><button id="ler">📸 Capturar e ler</button><button id="fechar" class="gray">Fechar</button></div><div id="ocr" class="muted" style="margin-top:8px">Aponte para o preço.</div><canvas id="canvas" hidden></canvas></section>
<section class="card"><div class="actions" style="margin-top:0"><strong style="flex:1;padding-top:12px">Itens</strong><button id="limpar" class="gray">Nova compra</button></div><div id="lista"></div><div id="vazio" class="muted" style="text-align:center;padding:18px">Nenhum item.</div></section>
<section class="card"><div class="actions" style="margin-top:0"><strong style="flex:1;padding-top:12px">📋 Histórico</strong><button id="apagar" class="gray">Apagar</button></div><div id="hist"></div><div id="hv" class="muted" style="text-align:center;padding:14px">Nenhuma compra finalizada.</div></section>
<div class="warning">Confira o valor reconhecido antes de adicionar. O OCR pode errar em etiquetas pequenas ou com reflexo.</div></main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
(()=>{const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);let items=[],stream=null,worker=null,hist=JSON.parse(localStorage.getItem('historicoCompras')||'[]');
function price(s){if(!s)return null;let a=s.replace(/R\$/gi,'').replace(/\s/g,'').match(/\d{1,4}(?:[.,]\d{3})*[.,]\d{2}|\d+[.,]\d{2}/g);if(!a)return null;for(let x of a){x=x.includes(',')?x.replace(/\./g,'').replace(',','.'):x;let n=Number(x);if(n>=.01&&n<100000)return n}return null}
function render(){let l=$('lista'),t=0;l.innerHTML='';items.forEach((x,i)=>{t+=x.p*x.q;let r=document.createElement('div');r.className='item';r.innerHTML='<div class="info"><div class="name"></div><div class="muted"></div></div><div class="value"></div><div class="qty"><button class="gray">−</button><button class="gray">+</button></div>';r.querySelector('.name').textContent=x.n||'Item '+(i+1);r.querySelector('.muted').textContent=money(x.p)+' × '+x.q;r.querySelector('.value').textContent=money(x.p*x.q);r.querySelectorAll('button')[0].onclick=()=>{if(x.q>1)x.q--;else items.splice(i,1);render()};r.querySelectorAll('button')[1].onclick=()=>{x.q++;render()};l.append(r)});$('total').textContent=money(t);$('vazio').style.display=items.length?'none':'block'}
function saveHist(){if(!items.length)return;let total=items.reduce((s,x)=>s+x.p*x.q,0);hist.unshift({d:new Date().toISOString(),total,n:items.length});hist=hist.slice(0,50);localStorage.setItem('historicoCompras',JSON.stringify(hist));drawHist()}
function drawHist(){let h=$('hist');h.innerHTML='';$('hv').style.display=hist.length?'none':'block';hist.forEach(x=>{let d=new Date(x.d),r=document.createElement('div');r.className='hist';r.innerHTML='<b></b><small></small>';r.querySelector('b').textContent=money(x.total);r.querySelector('small').textContent=' '+d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' • '+x.n+' item(ns)';h.append(r)})}
function beep(){try{let A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2)}catch(e){}}
function add(){let p=price($('preco').value);if(p==null){$('msg').textContent='Digite um preço válido, por exemplo 12,99.';return}items.push({n:$('nome').value.trim(),p,q:1});$('nome').value='';$('preco').value='';render();$('preco').focus()}
$('add').onclick=add;$('preco').onkeydown=e=>{if(e.key==='Enter')add()};$('limpar').onclick=()=>{saveHist();items=[];render()};$('apagar').onclick=()=>{if(confirm('Apagar todo o histórico?')){hist=[];localStorage.removeItem('historicoCompras');drawHist()}};
$('camera').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;$('camBox').style.display='block';$('camBox').scrollIntoView({behavior:'smooth'});$('ocr').textContent='Câmera ligada. Centralize o preço.'}catch(e){$('msg').textContent='Permita o acesso à câmera.'}};
$('fechar').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('camBox').style.display='none'};
$('ler').onclick=async()=>{if(!stream)return;let v=$('video'),c=$('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0,c.width,c.height);$('ocr').textContent='Lendo…';$('ler').disabled=true;try{if(!worker)worker=await Tesseract.createWorker('por');let r=await worker.recognize(c),p=price(r.data.text);if(p!=null){$('preco').value=p.toFixed(2).replace('.',',');$('ocr').textContent='🔊 Valor lido: '+money(p);beep();if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('Valor lido '+p.toFixed(2).replace('.', ' reais e '));u.lang='pt-BR';speechSynthesis.speak(u)}}else $('ocr').textContent='Preço não encontrado. Tente novamente.'}catch(e){$('ocr').textContent='Erro na leitura.'}finally{$('ler').disabled=false}};
render();drawHist()})()
</script></body></html>
