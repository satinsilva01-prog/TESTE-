<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste Reset Nativo</title><style>body{font-family:Arial,sans-serif;background:#eef1f4;margin:0;padding:24px;color:#17202a}.card{max-width:500px;margin:20px auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 3px 14px #0002}button{width:100%;padding:15px;border:0;border-radius:10px;margin-top:10px;font-weight:800;font-size:16px}.add{background:#16a34a;color:#fff}.reset{background:#dc2626;color:#fff}.value{font-size:48px;font-weight:900;text-align:center;margin:25px 0}.ok{padding:12px;background:#eef9f0;border-radius:10px;text-align:center}</style></head><body><div class="card"><h2>🧪 TESTE RESET NATIVO</h2><p>Neste teste o dado é salvo no armazenamento nativo Android, não no localStorage.</p><div id="value" class="value">0</div><div id="status" class="ok">Aguardando teste</div><button class="add" onclick="addTest()">ADICIONAR DADO DE TESTE</button><button class="reset" onclick="resetApp()">♻️ RESET NATIVO</button></div><script>function render(){document.getElementById('value').textContent=window.AndroidGPS.getTestValue();}function addTest(){let n=Number(window.AndroidGPS.getTestValue())+1;window.AndroidGPS.setTestValue(String(n));document.getElementById('status').textContent='Dado salvo no SharedPreferences do Android';render()}function resetApp(){if(!confirm('Apagar o dado nativo de teste?'))return;window.AndroidGPS.resetAll();document.getElementById('status').textContent='RESET NATIVO EXECUTADO';render()}render();</script></body></html>
