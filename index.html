<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste Reset Memória</title><style>body{font-family:Arial;text-align:center;padding:30px}.n{font-size:70px;font-weight:bold;margin:40px}button{width:100%;padding:18px;margin:10px 0;font-size:20px;border:0;border-radius:12px}.a{background:#16a34a;color:white}.r{background:#dc2626;color:white}</style></head><body><h2>TESTE RESET — MEMÓRIA</h2><div id="n" class="n">0</div><button class="a" onclick="n++;show()">+1</button><button class="r" onclick="n=0;show()">RESET</button><script>let n=0;function show(){document.getElementById('n').textContent=n}show()</script></body></html>
