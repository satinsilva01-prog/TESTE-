<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de Reset</title><style>body{font-family:Arial,sans-serif;background:#eef1f4;margin:0;padding:24px;color:#17202a}.card{max-width:500px;margin:20px auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 3px 14px #0002}button{width:100%;padding:15px;border:0;border-radius:10px;margin-top:10px;font-weight:800;font-size:16px}.add{background:#16a34a;color:#fff}.reset{background:#dc2626;color:#fff}.value{font-size:48px;font-weight:900;text-align:center;margin:25px 0}.ok{padding:12px;background:#eef9f0;border-radius:10px;text-align:center}</style></head><body><div class="card"><h2>🧪 TESTE ISOLADO DO RESET</h2><p>Este aplicativo existe somente para descobrir se o RESET funciona no APK.</p><div id="value" class="value">0</div><div id="status" class="ok">Aguardando teste</div><button class="add" onclick="addTest()">ADICIONAR DADO DE TESTE</button><button class="reset" onclick="resetApp()">♻️ RESETAR APLICATIVO</button></div><script>const KEY='teste_reset_valor';function render(){document.getElementById('value').textContent=localStorage.getItem(KEY)||'0'}function addTest(){let n=Number(localStorage.getItem(KEY)||0)+1;localStorage.setItem(KEY,n);document.getElementById('status').textContent='Dado salvo no armazenamento local';render()}function resetApp(){if(!confirm('Apagar o dado de teste?'))return;try{if(window.AndroidGPS&&typeof window.AndroidGPS.resetAll==='function')window.AndroidGPS.resetAll()}catch(e){}try{localStorage.clear()}catch(e){}try{sessionStorage.clear()}catch(e){}try{if(indexedDB&&indexedDB.databases){indexedDB.databases().then(ds=>ds.forEach(d=>d.name&&indexedDB.deleteDatabase(d.name))).catch(()=>{})}}catch(e){}document.getElementById('status').textContent='RESET EXECUTADO';render();setTimeout(()=>location.reload(),300)}render();</script></body></html>
