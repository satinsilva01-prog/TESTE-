<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste Reset Evento</title><style>body{font-family:Arial;text-align:center;padding:30px}.n{font-size:70px;font-weight:bold;margin:40px}button{width:100%;padding:18px;margin:10px 0;font-size:20px;border:0;border-radius:12px}.a{background:#16a34a;color:white}.r{background:#dc2626;color:white}</style></head><body><h2>TESTE RESET — EVENT LISTENER</h2><div id="n" class="n">0</div><button id="add" class="a">+1</button><button id="reset" class="r">RESET</button><script>let valor=0;const display=document.getElementById('n');function atualizar(){display.textContent=String(valor)}document.getElementById('add').addEventListener('click',function(){valor=valor+1;atualizar()});document.getElementById('reset').addEventListener('click',function(){valor=0;atualizar();display.textContent='0';document.body.setAttribute('data-reset','ok')});atualizar();</script></body></html>
